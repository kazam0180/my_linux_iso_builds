source /boot/grub/config.cfg

# Default live boot (no persistence)
@LINUX_LIVE@

# Live boot with unencrypted persistence.
# Looks for a volume labeled "persistence" with a persistence.conf at its root.
menuentry "kazamOS - Live with persistence" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
	initrd	@INITRD_LIVE@
}

# Live boot with LUKS-encrypted persistence.
# Prompts for a passphrase, then uses the persistence volume inside the LUKS
# container. Requires cryptsetup in the initramfs (see packages.list).
menuentry "kazamOS - Live with encrypted persistence (LUKS)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks
	initrd	@INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
